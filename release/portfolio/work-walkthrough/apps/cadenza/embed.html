<style>
/* Hallmark v2.0.0 | shape: app screen | theme: per-client tokens (custom, dealt per system) | scope: app | signature: per client */
/* critique: one shell, eleven client brands; brand lives in tokens, logo, signature artifact and content. */
/* Client workspace shell (byte-identical across all 11). Direction: Claude Opus 5.5. Brands fill tokens only (brand.css). */
:root{
  --sb-w:272px;--topbar-h:56px;
  --surface:#F4F4F2;--panel:#FDFDFC;--panel-2:#F6F6F4;--line:#E2E2DE;--line-strong:#CFCFC9;--ink:#141414;--ink-2:#5E5E58;--ink-3:#6E6E67;
  --sb-bg:#EDEDE9;--sb-ink:#141414;--sb-ink-2:#6A6A64;--sb-line:#E6E6E2;--sb-active-bg:var(--panel);--sb-active-ink:var(--sb-ink);--sb-tile-bg:#FDFDFC;--sb-badge-bg:rgba(127,127,127,.16);--topbar-bg:var(--surface);
  --accent:#345F82;--accent-ink:#FDFDFC;--accent-soft:#E5EEF8;--accent-strong:#2C4E66;
  --pos:#1D723E;--pos-soft:#E0F7E5;--neg:#B1322D;--neg-soft:#FFEBE8;--warn:#8D5416;--warn-soft:#FFF0D1;--focus:var(--accent-strong);
  --chart-1:var(--accent);--chart-2:#7D8597;--chart-3:#C9CCD3;--chart-4:#3F4A5E;--row-hover:rgba(127,127,127,.07);--skeleton:rgba(127,127,127,.14);
  --font-head:ui-sans-serif,system-ui,sans-serif;--font-body:ui-sans-serif,system-ui,sans-serif;--font-num:var(--font-body);--font-mono:ui-monospace,Menlo,Consolas,monospace;--head-weight:600;
  --radius:10px;--radius-ctl:max(4px,calc(var(--radius) - 4px));--radius-avatar:50%;--radius-logo:8px;--shadow-panel:var(--shadow-xs);
  --chart-5:#9AA0A8;--chart-6:#C2C6CC;--chart-ctx:#CFD2D6;--shadow-ink:20 20 20;--sb-accent:var(--accent);
  --shadow-xs:0 1px 2px rgb(var(--shadow-ink)/.06);
  --shadow-sm:0 1px 2px rgb(var(--shadow-ink)/.05),0 2px 8px -2px rgb(var(--shadow-ink)/.06);
  --shadow-md:0 2px 4px -1px rgb(var(--shadow-ink)/.06),0 12px 28px -8px rgb(var(--shadow-ink)/.14);
  --shadow-lg:0 4px 8px -2px rgb(var(--shadow-ink)/.07),0 28px 56px -16px rgb(var(--shadow-ink)/.22);
  --sev-critical:var(--neg);--sev-critical-soft:var(--neg-soft);--sev-critical-ink:var(--neg);
  --sev-error:var(--warn);--sev-error-soft:var(--warn-soft);--sev-error-ink:var(--warn);
  --sev-warning:var(--warn);--sev-warning-soft:var(--warn-soft);--sev-warning-ink:var(--warn);
  --sev-info:var(--ink-2);--sev-info-soft:var(--panel-2);--sev-info-ink:var(--ink-2);
  --e:cubic-bezier(.22,.61,.36,1);
  --shadow-pop:var(--shadow-md);--shadow-drawer:var(--shadow-lg);--shadow-seg:var(--shadow-xs);--scrim:rgb(10 10 10/.32);--vendor-tile-bg:#FEFEFE;--logo-bg:#FBFBFA;--logo-ink:#232323;
}
*,*::before,*::after{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
html,body{margin:0;height:100%;overflow-x:clip}
body{font:400 14px/20px var(--font-body);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--accent-soft);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent-strong);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ink2{color:var(--ink-2)}.ink3{color:var(--ink-3)}

/* ---------- layout ---------- */
.ws{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100vh;overflow:hidden}
.sb{background:var(--sb-bg);color:var(--sb-ink);border-right:1px solid var(--sb-line);display:flex;flex-direction:column;min-height:0}
.sb-scroll{flex:1;overflow:auto;padding:4px 12px 12px;min-height:0}
.sb-brand{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 16px;min-height:72px}
.sb-logo{width:36px;height:36px;border-radius:var(--radius-logo);flex:none;overflow:hidden;display:grid;place-items:center}
.sb-logo{background:none}.sb-logo svg{width:28px;height:28px}
.sb-name{font:600 15px/20px var(--font-head);}
.sb-tag{font-size:12px;line-height:16px;color:var(--sb-ink-2);margin-top:2px}
.sb-item{display:flex;align-items:center;gap:12px;width:100%;min-height:36px;padding:8px 12px;margin:1px 0;border:0;border-radius:var(--radius-ctl);background:none;color:var(--sb-ink);text-decoration:none;font-size:14px;line-height:20px;text-align:left;cursor:pointer;position:relative;transition:background-color 140ms var(--e)}
.sb-item svg{width:18px;height:18px;flex:none;color:var(--sb-ink-2);opacity:.85}
.sb-item:hover{background:var(--sb-active-bg)}
.sb-item[aria-current="page"]{background:var(--sb-active-bg);color:var(--sb-active-ink);font-weight:600;box-shadow:var(--shadow-xs)}
.sb-item[aria-current="page"] svg{color:var(--sb-accent)}
.sb-item[aria-current="page"]::before{display:none}
.sb-badge{margin-left:auto;min-width:22px;height:20px;padding:0 8px;border-radius:10px;background:var(--sb-badge-bg);font:600 12px/20px var(--font-num);text-align:center;font-variant-numeric:tabular-nums}
.sb-group{margin-top:12px}
.sb-ghead{display:flex;align-items:center;width:100%;min-height:36px;padding:8px 12px;border:0;background:none;color:var(--sb-ink-2);font:600 12px/16px var(--font-body);cursor:pointer;border-radius:var(--radius-ctl)}
.sb-ghead:hover{color:var(--sb-ink)}
.sb-ghead svg{margin-left:auto;width:16px;height:16px;transition:transform 200ms var(--e)}
.sb-ghead[aria-expanded="false"] svg{transform:rotate(-90deg)}
.sb-gbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows 200ms var(--e),opacity 200ms var(--e)}
.sb-gbody>div{overflow:hidden}
.sb-ghead[aria-expanded="false"]+.sb-gbody{grid-template-rows:0fr;opacity:0}
.sb-foot{border-top:1px solid var(--sb-line);padding:12px 16px 16px}
.sb-cap{font-size:12px;line-height:16px;color:var(--sb-ink-2);margin-bottom:8px}
.sb-tiles{display:flex;flex-wrap:wrap;gap:8px}
.sb-tile{width:24px;height:24px;border-radius:6px;background:transparent;border:0;display:grid;place-items:center;overflow:hidden}
.sb-tile img{width:100%;height:100%;object-fit:contain}
.sb-built{display:inline-block;margin-top:12px;font-size:12px;line-height:16px;color:var(--sb-ink-2);text-decoration:none}
.sb-built:hover{color:var(--sb-ink);text-decoration:underline}

.scrim-nav{display:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{flex:none;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--topbar-bg);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden}
.crumbs button{border:0;background:none;padding:4px 2px;color:var(--ink-2);cursor:pointer;border-radius:4px}
.crumbs button:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-3)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.top-end{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}

.range{position:relative}
.ctl{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-ctl);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color 140ms var(--e),border-color 140ms var(--e)}
.ctl:hover{border-color:var(--line-strong);background:var(--panel-2)}
.ctl:active{background:var(--skeleton)}
.ctl svg{width:16px;height:16px;color:var(--ink-2)}
.pop{position:absolute;right:0;top:40px;z-index:30;min-width:180px;background:var(--panel);border:0;border-radius:var(--radius);box-shadow:var(--shadow-pop);padding:8px}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:var(--radius-ctl);cursor:pointer;font-size:13px}
.pop button:hover,.pop button[aria-checked="true"]{background:var(--accent-soft);color:var(--ink)}
.menu-btn{display:none}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;min-height:0}
.page{max-width:1240px;margin:0 auto;padding:28px 28px 40px;display:grid;gap:24px}
.view-in{opacity:1;transform:none;}
@keyframes vin{from{opacity:1;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;gap:24px;justify-content:space-between}
.ph h1{font:600 24px/32px var(--font-head);text-wrap:balance}
.ph p{margin-top:8px;font-size:14px;line-height:20px;color:var(--ink-2);max-width:72ch}
.ph-link{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;background:none;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;padding:8px 0}
.ph-link svg{width:16px;height:16px}
.ph-link:hover{color:var(--accent-strong)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-ctl);background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color 140ms var(--e),border-color 140ms var(--e),transform 120ms var(--e)}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn:active{transform:translateY(1px);background:var(--skeleton)}
.btn svg,.btn img{width:16px;height:16px;object-fit:contain}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{background:color-mix(in oklch,var(--accent),white 8%);border-color:transparent}
.btn-accent:active{background:color-mix(in oklch,var(--accent),black 10%)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn-ink:hover{background:var(--ink);filter:brightness(1.15)}
.btn-sm{height:30px;padding:0 12px;font-size:12px}
:is(button,input,select,textarea):disabled,[aria-disabled="true"]{opacity:.5;filter:saturate(.4);cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);font:600 12px/22px var(--font-body);color:var(--ink-2);white-space:nowrap}
.chip img{width:14px;height:14px;object-fit:contain}
.chip .n{color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--panel);border:1px solid var(--ink);color:var(--ink);font-weight:600}
.seg{display:inline-flex;padding:4px;border-radius:var(--radius-ctl);background:var(--panel-2);border:1px solid var(--line)}
.seg button{border:1px solid transparent;background:none;height:28px;padding:0 12px;border-radius:calc(var(--radius-ctl) - 2px);font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);border:1px solid var(--ink);color:var(--ink);font-weight:600;box-shadow:var(--shadow-seg)}

/* ---------- status ---------- */
.st{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--ink-2)}
.st svg{width:12px;height:12px}
.st.pos{background:var(--pos-soft);color:var(--pos)}.st.neg{background:var(--neg-soft);color:var(--neg)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.acc{background:var(--accent-soft);color:var(--accent-strong)}
.delta{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font:600 12px/16px var(--font-num);font-variant-numeric:tabular-nums;background:var(--pos-soft);color:var(--pos)}
.delta.down{background:var(--neg-soft);color:var(--neg)}
.delta svg{width:12px;height:12px}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(var(--k,4),minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.kpi{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:20px;border-left:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.kpi:first-child{border-left:0}
button.kpi{cursor:pointer}button.kpi:hover{background:var(--row-hover)}
.kpi-l{display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-body);color:var(--ink-2)}
.kpi-v{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font:600 30px/36px var(--font-num)}
.kpi-v b{font:600 30px/36px var(--font-num);font-variant-numeric:tabular-nums;}
.kpi-s{font-size:12px;line-height:16px;color:var(--ink-3);margin-top:8px}
.stack{display:flex;margin-top:12px;align-items:center}
.stack .face{margin-left:-8px;}
.stack .face:first-child{margin-left:0}
.stack .more{margin-left:8px;font-size:12px;color:var(--ink-2)}

/* ---------- panels ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-panel);min-width:0;display:flex;flex-direction:column}
.p-h{display:flex;align-items:center;gap:12px;min-height:52px;padding:16px 20px 12px}
.p-h h2{font:600 16px/24px var(--font-head)}
.p-h .cnt{font:500 13px/20px var(--font-num);color:var(--ink-2);font-variant-numeric:tabular-nums}
.src{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap}
.src img{width:20px;height:20px;object-fit:contain}

.p-sub{padding:0 20px 12px;font-size:13px;line-height:19px;color:var(--ink-2);margin-top:0}
.p-b{padding:0 20px 20px;min-width:0;flex:1}
.p-b.flush{padding:0}
.p-f{border-top:1px solid var(--line);padding:12px 20px;font-size:13px}
.p-f button,.p-f a{border:0;background:none;color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0;text-decoration:none}
.p-f svg{width:14px;height:14px}
.note{padding:16px 20px;border-radius:var(--radius);background:var(--panel-2);border:1px solid var(--line);font-size:14px;line-height:22px}
.note b{font-weight:600}

/* ---------- people ---------- */
.face{flex:none;width:40px;height:40px;border-radius:var(--radius-avatar);background-color:var(--panel-2);background-repeat:no-repeat;background-size:800% 800%;display:inline-grid;place-items:center;font:600 13px/1 var(--font-body);color:var(--ink-2);position:relative}
.face.xs{width:24px;height:24px;font-size:12px}.face.sm{width:32px;height:32px;font-size:12px}.face.lg{width:52px;height:52px;font-size:16px}.face.xl{width:72px;height:72px;font-size:20px}
.face .ch{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:4px;background:var(--panel);display:grid;place-items:center;}
.face .ch img{width:12px;height:12px;object-fit:contain}
.prow{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 20px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;transition:background-color 140ms var(--e)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--row-hover)}
.prow .who{min-width:0;flex:1}
.prow .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prow .l1 b{font-weight:600}
.prow .l1 span{color:var(--ink-2)}
.prow .l2{font-size:13px;line-height:19px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prow .act{flex:none}
.person{display:inline-flex;align-items:center;gap:12px;min-width:0}
.person b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span{display:block;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--logo-bg);display:inline-grid;place-items:center;overflow:hidden}
.logo img,.logo svg{width:70%;height:70%;object-fit:contain}
.logo.txt{font:700 11px/1 var(--font-body);color:var(--logo-ink);background:var(--panel-2)}
.logo.sm{width:20px;height:20px;border-radius:5px}.logo.lg{width:36px;height:36px;border-radius:9px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.t th{position:sticky;top:0;z-index:1;background:none;text-align:left;font-size:12px;line-height:16px;font-weight:600;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.t td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:middle;height:40px}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}.t td.r,.t .numc{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t tbody tr{transition:background-color 140ms var(--e)}
.t tbody tr.click{cursor:pointer}
.t tbody tr:hover td{background:var(--row-hover)}
.t tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
.t th:first-child,.t td:first-child{padding-left:20px}.t th:last-child,.t td:last-child{padding-right:20px}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transform-origin:left}
.grow{}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.growy{transform-origin:bottom}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hatch{background-image:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 7px)}
.flash{}
@keyframes flash{from{background-color:var(--accent-soft)}to{background-color:transparent}}

/* ---------- kanban ---------- */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kb-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kb-h{display:flex;align-items:center;gap:8px;padding:4px 8px 8px;font-weight:600}
.kb-h .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

function revenue(){const y=n=>310-(n-70000)/20000*260;const xs=[100,260,420,580,740],w=76;const bars=[{label:'Opening',v:80000,lo:70000,hi:80000,end:80000},{label:'New',v:6000,lo:80000,hi:86000,end:86000},{label:'Expansion',v:2000,lo:86000,hi:88000,end:88000},{label:'Churn',v:-1500,lo:86500,hi:88000,end:86500},{label:'Closing',v:86500,lo:70000,hi:86500,end:86500}];return panel('revenue','MRR waterfall','stripe','<div class="waterfall-wrap"><svg class="waterfall" viewBox="0 0 900 410" role="img" aria-label="MRR waterfall: opening 80,000 dollars, plus 6,000 new, plus 2,000 expansion, minus 1,500 churn, closing 86,500 dollars. Axis starts at 70,000 dollars.">'+[70000,75000,80000,85000,90000].map(v=>'<line class="wf-grid" x1="76" x2="850" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="wf-axis" x="64" y="'+(y(v)+4)+'" text-anchor="end">'+(v?'$'+v/1000+'k':'$0')+'</text>').join('')+bars.map((b,i)=>'<g><rect rx="2" class="wf-bar '+(i===4?'wf-close':b.v<0?'wf-loss':i===0?'wf-opening':'wf-rise')+'" x="'+xs[i]+'" y="'+y(b.hi)+'" width="'+w+'" height="'+(y(b.lo)-y(b.hi))+'"/>'+ (i<4?'<path class="wf-connector" d="M'+(xs[i]+w)+' '+y(b.end)+'H'+xs[i+1]+'m-4 -4v8"/>':'')+'<text class="wf-value" x="'+(xs[i]+w/2)+'" y="'+(y(b.hi)-16)+'" text-anchor="middle">'+(i>0&&i<4&&b.v>0?'+':'')+S.usd(b.v)+'</text><text class="wf-label" x="'+(xs[i]+w/2)+'" y="338" text-anchor="middle">'+b.label+'</text>'+ (i>0&&i<4?'<text class="wf-axis" x="'+(xs[i]+w/2)+'" y="358" text-anchor="middle">'+S.usd(b.end)+' total</text>':'')+'</g>').join('')+'<line class="wf-baseline" x1="76" x2="850" y1="310" y2="310"/><text class="wf-axis" x="76" y="394">Axis starts at $70k; opening and closing bars are truncated.</text></svg></div>','60 new subscriptions add $6,000 MRR. Expansion adds $2,000; churn removes $1,500.',{right:owner(4)})}
D.bridgeRows=[['Opening MRR',80000],['New subscriptions',6000],['Expansion',2000],['Churn',-1500],['Closing MRR',86500]];
function limits(){return panel('limits','Approaching booking limits','posthog',D.accounts.filter(a=>a.usage>=80).map((a,i)=>'<div class="mini" data-tour="cz-limit-row-'+i+'">'+S.person(a.who,a.name)+mark(a)+'<div style="min-width:120px"><strong>'+a.usage+'% of 10,000</strong>'+S.bar(a.usage/100)+'</div><div>'+S.person(a.owner,'Growth owner','xs')+'</div>'+btn('Review upgrade','data-account="'+a.id+'"')+'</div>').join(''),'80% threshold, monthly reset on 1 December. Usage is not a billing event.')+signals()}
function upgrades(){return panel('upgrades','Upgrade opportunities','hubspot',S.kanban(['Identified','In conversation','Upgrade ready'].map((stage,k)=>({title:stage,cards:D.accounts.filter(a=>a.usage>=80).filter(a=>(D.moves[a.id]||'Identified')===stage).map(a=>'<div class="kb-card">'+S.person(a.who,a.name)+mark(a)+'<p>$200 expansion MRR, '+a.days+'d in stage</p>'+S.person(a.owner,'Owner','xs')+'<label class="sr" for="move-'+a.id+'">Move '+a.name+'</label><select id="move-'+a.id+'" data-move="'+a.id+'">'+['Identified','In conversation','Upgrade ready'].map(s=>'<option '+(s===stage?'selected':'')+'>'+s+'</option>').join('')+'</select></div>')}))),'Growth owners qualify the need before changing a subscription.')}
function pql(){return panel('pql','Product-qualified lead queue','posthog',workspaceRows(D.accounts.filter(a=>a.stage==='ten')),'132 workspaces reached 10 bookings. These six are next in the review queue.',{flush:true})+panel('qualification','Qualification policy','segment','<div class="mini"><div><strong>10 bookings and a business domain</strong><p>Exclude internal traffic. Deduplicate by workspace_id.</p></div>'+btn('Review policy owner','data-owner-help')+'</div>')}
function support(){return panel('support','Developer support handoffs','intercom',D.accounts.slice(0,6).map((a,i)=>'<div class="mini">'+S.person(a.who,a.name,'sm','intercom')+mark(a)+'<div><strong>'+['Availability API returns an empty window','Webhook retry policy','Timezone offset during daylight saving'][i%3]+'</strong><p>“Can you help us get the first booking through?”</p></div>'+S.person(i%5,'Assigned engineer','xs')+btn('Open workspace','data-account="'+a.id+'"')+'</div>').join(''),'Six open requests, oldest 4 hours. First booking remains the shared success condition.')}
function sales(){return panel('assist','Sales-assist queue','hubspot',D.accounts.filter(a=>a.stage==='ten').map(a=>'<div class="mini">'+S.person(a.who,a.name)+mark(a)+'<div><strong>'+a.seats+' seats, technical fit confirmed</strong><p>'+(D.assigned.has(a.id)?'Owner assigned, outreach queued':'Needs a named growth owner')+'</p></div>'+(D.assigned.has(a.id)?S.doneChip('Assigned'):btn('Assign owner','data-assign="'+a.id+'"'))+'</div>').join(''),'Keep product help separate from a commercial conversation.')}
function experiments(){return panel('experiments','Activation experiments','posthog',S.table([{h:'Experiment',v:'name'},{h:'Control',v:'control',r:true},{h:'Variant',v:'variant',r:true},{h:'Decision',v:'decision'},{h:'Owner',v:r=>S.person(r.owner,'Growth','xs')}],[{name:'Inline availability quickstart',control:'32 / 100 activated',variant:'41 / 100 activated',decision:'Keep running, +9 pts',owner:0},{name:'Webhook setup checklist',control:'48 / 120 activated',variant:'52 / 120 activated',decision:'Keep running, +3.3 pts',owner:1},{name:'Day-three founder nudge',control:'20 / 80 activated',variant:'29 / 80 activated',decision:'Keep running, +11.3 pts',owner:3}]),'Assignment is per workspace. Directional results, no winner declared.')+nudges()}
function events(){return panel('events','Accepted workspace events','segment',D.accounts.slice(0,12).map((a,i)=>'<div class="mini">'+S.person(a.who,a.name,'sm','posthog')+mark(a)+'<div class="mono">'+D.rungs.find(r=>r.id===a.stage).event+'<p>evt_cz_'+(8204+i)+', delivered once</p></div><span class="ink2">12:'+String(42-i).padStart(2,'0')+':08</span>'+S.state('pos','Accepted')+'</div>').join(''),'Segment delivers, PostHog computes milestones. Duplicate event IDs are ignored.')+panel('runlog','Workspace activity log','slack',S.LOG.length?S.LOG.map(l=>'<div class="mini">'+S.person(l.who||0,l.t)+'<span>'+S.esc(l.text)+'</span></div>').join(''):'<div class="mini">'+S.person(0,'Growth operations')+'<span>No actions in this session. Nudge a workspace to create an audit entry.</span></div>')}
function mount(el){clearInterval(eventTimer);const live=el.querySelector('[data-tour="cz-live-event"]');if(live&&!S.reduced()){eventTimer=setInterval(()=>{if(!live.isConnected){clearInterval(eventTimer);return}if(S.reduced())return;tick++;const events=[['booking.created','quillbyte'],['api_key.created','altoframe'],['availability.queried','hollowpeak'],['booking.created','clearslot']];const ev=events[tick%events.length];live.querySelector('[data-event-name]').textContent=ev[0];live.querySelector('[data-event-workspace]').textContent=ev[1];live.querySelector('[data-event-time]').textContent=new Date(Date.UTC(2026,10,2,12,42,8)+tick*4000).toISOString().slice(11,19);live.querySelector('[data-event-id]').textContent='evt_cz_'+(8216+tick);},4000)}el.addEventListener('click',e=>{if(e.target.closest('[data-owner-help]')){S.toast('Policy owner: '+S.p(1).name);return}const rung=e.target.closest('[data-rung]');if(rung){S.go('workspaces',{stage:rung.dataset.rung});return}const a=e.target.closest('[data-account]');if(a){drawer(D.accounts[+a.dataset.account]);return}const w=e.target.closest('[data-week]');if(w){if(D.week===w.dataset.week){S.toast('Already applied');return}D.week=w.dataset.week;S.log('Cohort week selected: '+D.week,2);S.render(true)}const ass=e.target.closest('[data-assign]');if(ass){const id=+ass.dataset.assign;if(D.assigned.has(id)){S.toast('Already applied');return}D.assigned.add(id);S.log('Assigned '+D.accounts[id].name+' to '+S.p(D.accounts[id].owner).name,D.accounts[id].owner);S.render(true)}});el.addEventListener('change',e=>{if(e.target.matches('[data-move]')){const id=+e.target.dataset.move,to=e.target.value;if(D.moves[id]===to){S.toast('Already applied');return}D.moves[id]=to;S.log('Moved '+D.accounts[id].name+' to '+to,D.accounts[id].owner);S.render(true)}})}
const defs=[['today','Today','360 API-ready workspaces have no booking; 3 teams are above 80% of their allowance.',()=>kpis()+eventStrip()+ladder()+'<div class="grid g2">'+nudges()+signals()+'</div>'+code()],['summary','Growth summary','480 workspaces activated this month; net new MRR is $6,500.',()=>kpis()+ladder()+revenue(true)],['pql','Product-qualified leads','132 teams have made at least 10 bookings. Help the highest-intent founders move forward.',pql],['support','Support handoffs','Developer questions that block the first booking, with the engineer who owns the next answer.',support],['funnel','Signup funnel','1,200 workspaces entered the funnel. 480 made a first booking and 60 became paying customers.',()=>ladder()+nudges()],['cohorts','Activation cohorts','4 October cohorts are still maturing; mature D30 retention ranges from 60% to 65%.',cohort],['workspaces','Workspaces','18 priority workspaces are queued for review out of 1,200 new workspaces.',accountPanel],['limits','Usage limits','Hollowpeak is at 94% of its booking allowance; 2 more teams are above 80%.',limits],['upgrades','Upgrades','3 usage-qualified workspaces represent $600 in potential expansion MRR.',upgrades],['assist','Sales assist','6 qualified teams need a named growth owner before commercial outreach.',sales],['revenue','Revenue','A reconciled monthly bridge for the scheduling API, through 2 November 2026.',revenue],['experiments','Experiments','3 activation experiments are running; no winner has been declared.',experiments],['events','Event stream','12 recent workspace events were accepted once; duplicate event IDs are ignored.',events]];
const views=Object.fromEntries(defs.map(([id,title,sub,render])=>[id,{title,sub,render,mount}]));
const item=(id,label,icon,badge)=>({id,label,icon,badge});
S.init({sourceDate:'2 Nov',sidebarTone:'light',brand:{name:'Cadenza',tagline:'Scheduling infrastructure for product teams',logo:"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" width=\"32\" height=\"32\" role=\"img\" aria-label=\"Cadenza\"><path fill=\"#2D57E5\" d=\"M3 15.2a8 8 0 0 1 16 0z\"/><path fill=\"#2D57E5\" d=\"M13 16.8a8 8 0 0 0 16 0z\"/><circle cx=\"24.5\" cy=\"9\" r=\"3\" fill=\"#80A4FF\"/></svg>"},pinned:[item('today','Today','sun'),item('summary','Growth summary','chart')],groups:[{id:'inbox',label:'Inbox',items:[item('pql','Product-qualified leads','inbox',132),item('support','Support handoffs','chat',6)]},{id:'activation',label:'Activation',items:[item('funnel','Signup funnel','layers'),item('cohorts','Activation cohorts','grid'),item('workspaces','Workspaces','users')]},{id:'expansion',label:'Expansion',items:[item('limits','Usage limits','activity'),item('upgrades','Upgrades','kanban'),item('assist','Sales assist','phone')]},{id:'numbers',label:'Analysis',items:[item('revenue','Revenue','dollar'),item('experiments','Experiments','flag')]},{id:'system',label:'System',items:[item('events','Event stream','db')]}],sources:['posthog','segment','stripe','customer-io','intercom','hubspot','slack'].map(key=>({key,label:({'customer-io':'Customer.io',posthog:'PostHog',segment:'Segment',stripe:'Stripe',intercom:'Intercom',hubspot:'HubSpot',slack:'Slack'})[key]})),default:'today',views,reset(){D.nudged.clear();D.assigned.clear();D.moves={};D.week='all';tick=0;clearInterval(eventTimer)}});
})();

<script>
(()=>{'use strict';const S=Shell,D=DATA,V=V4;let handles=[];const sum=V.sums;const esc=S.esc;const tip=o=>' data-tip="'+esc(JSON.stringify(o))+'" tabindex="0"';const clientMark=()=>'<span class="cz-brand-mark">'+document.querySelector('.sb-logo').innerHTML+'</span>';const logo=k=>S.logo(k,'sm',({'posthog':'PostHog',linkedin:'LinkedIn','google-ads':'Google Ads',stripe:'Stripe',segment:'Segment'})[k]||k);const panel=(id,title,source,body,sub='')=>S.panel({id,title,source:[source,''],body,sub});const slot=id=>'<div id="'+id+'"></div>';const periods=['7d','30d','90d'];const range=()=>V.range();const n=()=>V.days();const vals=k=>V.vals(k);const total=k=>V.total(k);const dates=()=>V.dates.slice(-n());const fmtDate=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});const rate=()=>total('activated')/total('signups');const closing=()=>SERIES.mrr[89];const beginning=()=>n()===90?70500:SERIES.mrr[89-n()];
function select(p){if(!periods.includes(p))p='30d';S.range=parseInt(p);S.setParam('range',p);S.render(true)}
const previous=k=>n()<=30?sum(SERIES[k].slice(90-n()*2,90-n())):null;
function mainKpis(){const ps=previous('signups'),pa=previous('activated');return S.kpis([{label:'Activated workspaces',value:S.pct(rate()),raw:rate(),previousRaw:ps?pa/ps:null,format:'pct',hero:true,vendor:'posthog',good:'up',context:S.int(total('activated'))+' of '+S.int(total('signups'))+' made a first booking'},{label:'New workspaces',value:S.int(total('signups')),raw:total('signups'),previousRaw:ps,vendor:'segment',context:S.int(total('apikey'))+' generated an API key'},{label:'Product-qualified',value:S.int(total('pqa')),raw:total('pqa'),previousRaw:previous('pqa'),vendor:'posthog',context:S.pct(total('pqa')/total('signups'))+' reached 10 bookings'},{label:'Monthly recurring revenue',value:S.usd(closing()),raw:closing(),previousRaw:beginning(),format:'usd',vendor:'stripe',context:S.usd(closing()-beginning())+' net new in '+range(),tour:'cz-kpi-mrr'}])}
function chartPanel(root,id,title,type,options,source='posthog',sub=''){const e=document.createElement('div');e.innerHTML=panel(id,title,source,slot(id+'-plot'),sub);root.append(e.firstElementChild);handles.push(S.chart[type]('#'+id+'-plot',{id,title,format:'int',height:260,legend:true,table:true,...options}))}
function hero(el){const pp={};for(const key of periods){const days=parseInt(key),x=V.dates.slice(-days),sg=SERIES.signups.slice(-days),ac=SERIES.activated.slice(-days),rr=sg.map((_,i)=>sum(ac.slice(Math.max(0,i-6),i+1))/sum(sg.slice(Math.max(0,i-6),i+1)));pp[key]={x,series:[{key:'signups',label:'New workspaces',type:'bar',values:sg,color:'--cat-1',platform:false},{key:'activation',platform:true,logo:'posthog',label:'First booking rate',type:'line',axis:'right',values:rr,format:'pct'}],compare:{values:sg.map(()=>.36),label:'Previous activation rate',axis:'right',format:'pct'},stats:[{label:'API key rate',value:sum(SERIES.apikey.slice(-days))/sum(sg),format:'pct',delta:days<=30?sum(SERIES.apikey.slice(-days))/sum(sg)-sum(SERIES.apikey.slice(90-days*2,90-days))/sum(SERIES.signups.slice(90-days*2,90-days)):null,good:'up'},{label:'Activated to PQA',value:sum(SERIES.pqa.slice(-days))/sum(ac),format:'pct',delta:days<=30?sum(SERIES.pqa.slice(-days))/sum(ac)-sum(SERIES.pqa.slice(90-days*2,90-days))/sum(SERIES.activated.slice(90-days*2,90-days)):null,good:'up'},{label:'Signup to paid',value:sum(SERIES.paid.slice(-days))/sum(sg),format:'pct',delta:days<=30?sum(SERIES.paid.slice(-days))/sum(sg)-sum(SERIES.paid.slice(90-days*2,90-days))/sum(SERIES.signups.slice(90-days*2,90-days)):null,good:'up'},{label:'Net MRR added',value:sum(SERIES.newMRR.slice(-days))+sum(SERIES.expansion.slice(-days))-sum(SERIES.churn.slice(-days)),format:'usd',delta:days<=30?(sum(SERIES.newMRR.slice(-days))+sum(SERIES.expansion.slice(-days))-sum(SERIES.churn.slice(-days)))-(sum(SERIES.newMRR.slice(90-days*2,90-days))+sum(SERIES.expansion.slice(90-days*2,90-days))-sum(SERIES.churn.slice(90-days*2,90-days))):null,good:'up'}],annotations:[{x:'2026-10-08',label:'Checklist enabled',logo:'posthog'},{x:'2026-10-19',label:'First-booking nudge',logo:'customer-io'},{x:'2026-10-28',label:'Annual plan launched',logo:'stripe'}],insight:'Activation rose 4 pts after the checklist; the drop is still before first booking. '+S.int(sum(sg))+' workspaces joined in this window.'}}handles.push(S.chart.hero(el,{id:'cz-hero',title:'Workspace activation',question:'Are new workspaces reaching first booking and paying?',type:'combo',periodSwitch:false,compare:true,period:range(),periods:pp,source:['segment','posthog','stripe'],rightFormat:'pct',format:'int',tip:{delta:false,footnote:'Previous activation rate: 36.0%; current ending rate: 40.0%, a 4.0-point improvement.'},insight:'Activation rose 4 pts after the checklist; the drop is still before first booking.'}))}
function ladderTips(root){const keys=['signups','apikey','activated','pqa','paid'],counts=keys.map(total);root.querySelectorAll('.rung').forEach((row,i)=>{const r=D.rungs[i],ct=counts[i],wait=i<4?ct-counts[i+1]:0;row.setAttribute('data-tip',JSON.stringify({t:r.label,logo:'posthog',rows:[['Workspaces',ct,'int'],['Of signups',ct/counts[0],'pct'],['Waiting at milestone',wait,'int']],fn:'Median time to next: '+r.median}));row.tabIndex=0;row.querySelector('.rung-fill').style.width=ct/counts[0]*100+'%';row.querySelector('.rung-track b').textContent=S.int(ct);row.querySelector('.rung-name>span').textContent=S.pct(ct/counts[0])+' of signups';const strong=row.querySelector('.stuck strong');if(strong)strong.textContent=i<4?wait+' waiting':ct+' paid workspaces';row.querySelectorAll('.stuck .face').forEach((face,j)=>{const who=r.who[j],a=D.accounts.find(a=>a.who===who);face.setAttribute('data-tip',JSON.stringify({t:a?a.name:S.p(who).name,logo:'posthog',rows:[['Stuck days',a?.days||0,'int'],['Seats',a?.seats||0,'int']],fn:S.p(who).name+', last event: '+r.event}));face.tabIndex=0})});const sub=root.querySelector('[data-panel="ladder"] .p-sub');if(sub)sub.textContent='First-booking gap: '+S.int(counts[1])+' API-ready to '+S.int(counts[2])+' first bookings, '+S.int(counts[1]-counts[2])+' waiting ('+S.pct((counts[1]-counts[2])/counts[1])+').';root.querySelectorAll('.bar,.stack').forEach(el=>{if(el.closest('.rung'))return;el.setAttribute('data-tip',JSON.stringify({t:'Workspace activity',rows:[['Range',range()]],fn:'Current workspace context'}));el.tabIndex=0})}
function adStats(a){return ['signups','apikey','activated'].map(k=>sum(a.series[k].slice(-n())))}
function gallery(){return panel('paid-gallery','Paid acquisition creatives',['linkedin','google-ads'],'<div class="cz-gallery">'+V.ads.map(a=>{const stats=adStats(a);const image=a.id===0?S.creative('cd-paid-01'):a.id===1?S.creative('cd-paid-02'):S.creative('cd-paid-03');const picture='<img class="cz-ad-image" src="'+image+'" alt="'+(a.id===0?'Quiet workspace with cobalt planning notes':a.id===1?'Minimal desk with notebook and cobalt cup':'Planning board with cobalt notes')+'">';const results='<div class="cz-ad-results"><span>'+S.int(stats[0])+' signups</span><button type="button" class="btn btn-sm" data-ad="'+a.id+'"'+tip({t:a.title,logo:a.platform,rows:[['Signups',stats[0],'int'],['API keys',stats[1],'int'],['Activated',stats[2],'int'],['Activation rate',stats[2]/stats[0],'pct']],fn:'Attributed workspace cohort, '+range()})+'>View results</button></div>';const ad=a.platform==='google-ads'?'<article class="cz-ad display-ad" aria-label="Google Display ad"><div class="cz-display-badge"><span>Ad</span>'+logo('google-ads')+'</div>'+picture+'<div class="cz-display-content">'+clientMark()+'<h3>'+esc(a.title)+'</h3><p>'+esc(a.body)+'</p></div><div class="cz-display-url"><span>cadenza.dev</span><span class="cz-display-go" aria-hidden="true">'+S.icon('right')+'</span></div></article>':'<article class="cz-ad linkedin-ad" aria-label="LinkedIn sponsored post"><div class="cz-ad-head">'+clientMark()+'<div><strong>Cadenza</strong><span>Sponsored</span></div>'+logo('linkedin')+'</div><p class="cz-ad-body">'+esc(a.body)+'</p>'+picture+'<div class="cz-ad-copy"><span>cadenza.dev</span><h3>'+esc(a.title)+'</h3></div><div class="cz-ad-cta"><span>'+esc(a.cta)+'</span></div></article>';return '<div class="cz-ad-entry">'+ad+results+'</div>'}).join('')+'</div>','Paid-attributed subset: '+S.int(V.ads.reduce((s,a)=>s+adStats(a)[0],0))+' signups. Not additional to the workspace totals.')}
function adDrawer(a){const stats=adStats(a);S.drawer.open({title:a.title,head:logo(a.platform)+clientMark(),body:'<p>'+esc(a.body)+'</p><div class="facts"><div><span>Signups</span><strong>'+stats[0]+'</strong></div><div><span>API keys</span><strong>'+stats[1]+'</strong></div><div><span>Activated</span><strong>'+stats[2]+'</strong></div><div><span>Activation rate</span><strong>'+S.pct(stats[2]/stats[0])+'</strong></div></div>'+slot('ad-result-chart'),foot:'<span class="ink2">'+range()+' attributed workspaces, one workspace counted once per milestone</span>',onOpen(){handles.push(S.chart.line('#ad-result-chart',{title:'Creative activation path',x:dates(),series:[{key:'adSignups',label:'Signups',values:a.series.signups.slice(-n()),platform:false,color:'--cat-1'},{key:'adKeys',label:'API keys',values:a.series.apikey.slice(-n()),platform:false,color:'--cat-2'},{key:'adAct',label:'First bookings',values:a.series.activated.slice(-n()),platform:false,color:'--cat-3'}],format:'int',height:260}))}})}
function enhance(){const root=document.querySelector('#main');if(!root)return;const p=range();S.range=parseInt(p);const rc=document.querySelector('.range');rc.innerHTML='<div class="seg" aria-label="Reporting range">'+periods.map(x=>'<button type="button" data-czrange="'+x+'" aria-pressed="'+(x===p)+'">'+x+'</button>').join('')+'</div>';rc.onclick=e=>{const b=e.target.closest('[data-czrange]');if(b)select(b.dataset.czrange)};const kp=root.querySelector('.kpis');if(kp){const box=document.createElement('div');box.innerHTML=mainKpis();kp.replaceWith(box.firstElementChild)}const today=S.view()==='today'||S.view()==='summary';if(today){const h=document.createElement('section');h.id='cz-hero';root.querySelector('.kpis').after(h);hero(h)}const wrap=document.createElement('div');wrap.className='cz-chart-work';root.querySelector('.ph').after(wrap);const common={x:dates(),formatX:fmtDate};const line=(id,title,k,source='posthog')=>chartPanel(wrap,id,title,'line',{...common,series:[{key:k,label:title,values:vals(k),platform:false}]},source,S.int(total(k))+' across all displayed days.');
switch(S.view()){
case 'funnel':chartPanel(wrap,'cz-funnel','Signup milestone progression','funnel',{steps:D.rungs.map((r,i)=>({label:r.label,value:total(['signups','apikey','activated','pqa','paid'][i]),logo:i===4?'stripe':'posthog'})),highlight:2},'posthog',S.int(total('signups'))+' workspaces in '+range());break;
case 'cohorts':chartPanel(wrap,'cz-cohort','Weekly signup cohort progression','cohort',{rows:V.cohort.filter(c=>n()!==7||c.label>=V.dates[83-6]).map(c=>({label:fmtDate(c.label)+' ('+c.size+')',size:c.size,values:c.counts.map(x=>({v:x/c.size,tip:x+' workspaces'}))})),cols:['API key','First booking','10 bookings','Paid'],format:'pct',height:300,tip:{footnote:'Percent of each signup cohort; rows show workspace count.'}},'posthog','Five cohorts: 230, 250, 260, 270, 190 workspaces. Phase: onboarding, activation, commercial intent.');break;
case 'workspaces':chartPanel(wrap,'cz-workspace-scatter','Team size and booking activity','scatter',{points:D.accounts.map(a=>({x:a.seats,y:a.events,r:20+a.seats*3,label:a.name,logo:'posthog'})),xFormat:'int',yFormat:'int',title:'Seats vs monthly events'},'posthog','18 priority workspaces; seat count and current monthly events.');break;
case 'limits':chartPanel(wrap,'cz-usage','Booking allowance by workspace','bullet',{rows:D.accounts.filter(a=>a.usage>=80).map(a=>({label:a.name,value:a.events,target:10000,ranges:[8000,10000],logo:'posthog'}))},'posthog','80% review threshold, 10,000 monthly booking limit.');break;
case 'upgrades':chartPanel(wrap,'cz-upgrades','Paid workspaces by week','bar',{x:Array.from({length:Math.ceil(n()/7)},(_,i)=>'Week '+(i+1)),series:[{key:'paid',label:'Paid workspaces',values:Array.from({length:Math.ceil(n()/7)},(_,i)=>sum(vals('paid').slice(i*7,i*7+7))),platform:false}]},'stripe',S.int(total('paid'))+' paid workspaces across displayed weeks.');break;
case 'revenue':{const panelR=root.querySelector('[data-panel="revenue"] [data-body]');panelR.innerHTML=slot('cz-mrr-waterfall');handles.push(S.chart.waterfall('#cz-mrr-waterfall',{title:'MRR bridge',steps:[{label:'Opening',value:beginning(),kind:'total'},{label:'New',value:total('newMRR'),kind:'delta'},{label:'Expansion',value:total('expansion'),kind:'delta'},{label:'Churn',value:-total('churn'),kind:'delta'},{label:'Closing',value:closing(),kind:'total'}],yMin:n()===90?65000:70000,format:'usd',height:280}));chartPanel(wrap,'cz-mrr-line','Recurring revenue over time','line',{...common,series:[{key:'mrr',label:'MRR',values:vals('mrr'),platform:false}],format:'usd'},'stripe',S.usd(closing())+' closing MRR, '+S.usd(closing()-beginning())+' net new in '+range());break}
case 'experiments':chartPanel(wrap,'cz-experiment','Activation by experiment flag','bar',{x:['Quickstart','Webhook checklist','Founder nudge'],grouped:true,series:[{key:'control',label:'Control',values:[.32,.4,.25],platform:false,color:'--cat-2'},{key:'variant',label:'Variant',values:[.41,.4333,.3625],platform:false,color:'--cat-1'}],format:'pct'},'posthog','Per-workspace assignment. Control and variant conversion, no winner declared.');wrap.insertAdjacentHTML('beforeend',gallery());break;
case 'events':chartPanel(wrap,'cz-events-chart','Accepted events per minute','spark',{x:Array.from({length:60},(_,i)=>'12:'+String(i).padStart(2,'0')),values:V.alloc(60,1248),format:'int',height:180},'segment','1,248 accepted events in the displayed hour.');break;
case 'pql':line('cz-qualified','Product-qualified workspaces','pqa');break;case 'support':line('cz-support-impact','First bookings supported','activated','intercom');break;case 'assist':line('cz-assist-demand','Commercial-intent workspaces','pqa','hubspot');break;
}
if(!wrap.children.length)wrap.remove();ladderTips(root);root.addEventListener('click',e=>{const ad=e.target.closest('[data-ad]');if(ad)adDrawer(V.ads[+ad.dataset.ad])});root.addEventListener('click',e=>{const b=e.target.closest('[data-period]');if(b){e.stopImmediatePropagation();select(b.dataset.period)}},true);S.tip.attach(root);S.refreshScrollers(root)}
const go=S.go;S.go=(view,params,noHash)=>go(view,{range:V.range(),...(params||{})},noHash);const render=S.render;S.render=function(...args){handles.forEach(h=>h.destroy());handles=[];render(...args);enhance()};enhance();})();

</script>
