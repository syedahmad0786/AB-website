/* Hallmark v2.0.0 | shape: app screen | theme: per-client tokens (custom, dealt per system) | scope: app | signature: per client */
/* critique: one shell, eleven client brands; brand lives in tokens, logo, signature artifact and content. */
/* Client workspace shell (byte-identical across all 11). Direction: Claude Opus 5.5. Brands fill tokens only (brand.css). */
:root{
  --sb-w:272px;--topbar-h:56px;
  --surface:#F4F4F2;--panel:#FDFDFC;--panel-2:#F6F6F4;--line:#E2E2DE;--line-strong:#CFCFC9;--ink:#141414;--ink-2:#5E5E58;--ink-3:#6E6E67;
  --sb-bg:#EDEDE9;--sb-ink:#141414;--sb-ink-2:#6A6A64;--sb-line:#E6E6E2;--sb-active-bg:var(--panel);--sb-active-ink:var(--sb-ink);--sb-tile-bg:#FDFDFC;--sb-badge-bg:rgba(127,127,127,.16);--topbar-bg:var(--surface);
  --accent:#345F82;--accent-ink:#FDFDFC;--accent-soft:#E5EEF8;--accent-strong:#2C4E66;
  --pos:#1D723E;--pos-soft:#E0F7E5;--neg:#B1322D;--neg-soft:#FFEBE8;--warn:#8D5416;--warn-soft:#FFF0D1;--focus:var(--accent-strong);
  --chart-1:var(--accent);--chart-2:#7D8597;--chart-3:#C9CCD3;--chart-4:#3F4A5E;--row-hover:rgba(127,127,127,.07);--skeleton:rgba(127,127,127,.14);
  --font-head:ui-sans-serif,system-ui,sans-serif;--font-body:ui-sans-serif,system-ui,sans-serif;--font-num:var(--font-body);--font-mono:ui-monospace,Menlo,Consolas,monospace;--head-weight:600;
  --radius:10px;--radius-ctl:max(4px,calc(var(--radius) - 4px));--radius-avatar:50%;--radius-logo:8px;--shadow-panel:var(--shadow-xs);
  --chart-5:#9AA0A8;--chart-6:#C2C6CC;--chart-ctx:#CFD2D6;--shadow-ink:20 20 20;--sb-accent:var(--accent);
  --shadow-xs:0 1px 2px rgb(var(--shadow-ink)/.06);
  --shadow-sm:0 1px 2px rgb(var(--shadow-ink)/.05),0 2px 8px -2px rgb(var(--shadow-ink)/.06);
  --shadow-md:0 2px 4px -1px rgb(var(--shadow-ink)/.06),0 12px 28px -8px rgb(var(--shadow-ink)/.14);
  --shadow-lg:0 4px 8px -2px rgb(var(--shadow-ink)/.07),0 28px 56px -16px rgb(var(--shadow-ink)/.22);
  --sev-critical:var(--neg);--sev-critical-soft:var(--neg-soft);--sev-critical-ink:var(--neg);
  --sev-error:var(--warn);--sev-error-soft:var(--warn-soft);--sev-error-ink:var(--warn);
  --sev-warning:var(--warn);--sev-warning-soft:var(--warn-soft);--sev-warning-ink:var(--warn);
  --sev-info:var(--ink-2);--sev-info-soft:var(--panel-2);--sev-info-ink:var(--ink-2);
  --e:cubic-bezier(.22,.61,.36,1);
  --shadow-pop:var(--shadow-md);--shadow-drawer:var(--shadow-lg);--shadow-seg:var(--shadow-xs);--scrim:rgb(10 10 10/.32);--vendor-tile-bg:#FEFEFE;--logo-bg:#FBFBFA;--logo-ink:#232323;
}
*,*::before,*::after{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
html,body{margin:0;height:100%;overflow-x:clip}
body{font:400 14px/20px var(--font-body);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--accent-soft);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent-strong);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ink2{color:var(--ink-2)}.ink3{color:var(--ink-3)}

/* ---------- layout ---------- */
.ws{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100vh;overflow:hidden}
.sb{background:var(--sb-bg);color:var(--sb-ink);border-right:1px solid var(--sb-line);display:flex;flex-direction:column;min-height:0}
.sb-scroll{flex:1;overflow:auto;padding:4px 12px 12px;min-height:0}
.sb-brand{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 16px;min-height:72px}
.sb-logo{width:36px;height:36px;border-radius:var(--radius-logo);flex:none;overflow:hidden;display:grid;place-items:center}
.sb-logo{background:none}.sb-logo svg{width:28px;height:28px}
.sb-name{font:600 15px/20px var(--font-head);}
.sb-tag{font-size:12px;line-height:16px;color:var(--sb-ink-2);margin-top:2px}
.sb-item{display:flex;align-items:center;gap:12px;width:100%;min-height:36px;padding:8px 12px;margin:1px 0;border:0;border-radius:var(--radius-ctl);background:none;color:var(--sb-ink);text-decoration:none;font-size:14px;line-height:20px;text-align:left;cursor:pointer;position:relative;transition:background-color 140ms var(--e)}
.sb-item svg{width:18px;height:18px;flex:none;color:var(--sb-ink-2);opacity:.85}
.sb-item:hover{background:var(--sb-active-bg)}
.sb-item[aria-current="page"]{background:var(--sb-active-bg);color:var(--sb-active-ink);font-weight:600;box-shadow:var(--shadow-xs)}
.sb-item[aria-current="page"] svg{color:var(--sb-accent)}
.sb-item[aria-current="page"]::before{display:none}
.sb-badge{margin-left:auto;min-width:22px;height:20px;padding:0 8px;border-radius:10px;background:var(--sb-badge-bg);font:600 12px/20px var(--font-num);text-align:center;font-variant-numeric:tabular-nums}
.sb-group{margin-top:12px}
.sb-ghead{display:flex;align-items:center;width:100%;min-height:36px;padding:8px 12px;border:0;background:none;color:var(--sb-ink-2);font:600 12px/16px var(--font-body);cursor:pointer;border-radius:var(--radius-ctl)}
.sb-ghead:hover{color:var(--sb-ink)}
.sb-ghead svg{margin-left:auto;width:16px;height:16px;transition:transform 200ms var(--e)}
.sb-ghead[aria-expanded="false"] svg{transform:rotate(-90deg)}
.sb-gbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows 200ms var(--e),opacity 200ms var(--e)}
.sb-gbody>div{overflow:hidden}
.sb-ghead[aria-expanded="false"]+.sb-gbody{grid-template-rows:0fr;opacity:0}
.sb-foot{border-top:1px solid var(--sb-line);padding:12px 16px 16px}
.sb-cap{font-size:12px;line-height:16px;color:var(--sb-ink-2);margin-bottom:8px}
.sb-tiles{display:flex;flex-wrap:wrap;gap:8px}
.sb-tile{width:24px;height:24px;border-radius:6px;background:transparent;border:0;display:grid;place-items:center;overflow:hidden}
.sb-tile img{width:100%;height:100%;object-fit:contain}
.sb-built{display:inline-block;margin-top:12px;font-size:12px;line-height:16px;color:var(--sb-ink-2);text-decoration:none}
.sb-built:hover{color:var(--sb-ink);text-decoration:underline}

.scrim-nav{display:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{flex:none;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--topbar-bg);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden}
.crumbs button{border:0;background:none;padding:4px 2px;color:var(--ink-2);cursor:pointer;border-radius:4px}
.crumbs button:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-3)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.top-end{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}

.range{position:relative}
.ctl{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-ctl);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color 140ms var(--e),border-color 140ms var(--e)}
.ctl:hover{border-color:var(--line-strong);background:var(--panel-2)}
.ctl:active{background:var(--skeleton)}
.ctl svg{width:16px;height:16px;color:var(--ink-2)}
.pop{position:absolute;right:0;top:40px;z-index:30;min-width:180px;background:var(--panel);border:0;border-radius:var(--radius);box-shadow:var(--shadow-pop);padding:8px}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:var(--radius-ctl);cursor:pointer;font-size:13px}
.pop button:hover,.pop button[aria-checked="true"]{background:var(--accent-soft);color:var(--ink)}
.menu-btn{display:none}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;min-height:0}
.page{max-width:1240px;margin:0 auto;padding:28px 28px 40px;display:grid;gap:24px}
.view-in{opacity:1;transform:none;}
@keyframes vin{from{opacity:1;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;gap:24px;justify-content:space-between}
.ph h1{font:600 24px/32px var(--font-head);text-wrap:balance}
.ph p{margin-top:8px;font-size:14px;line-height:20px;color:var(--ink-2);max-width:72ch}
.ph-link{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;background:none;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;padding:8px 0}
.ph-link svg{width:16px;height:16px}
.ph-link:hover{color:var(--accent-strong)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-ctl);background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color 140ms var(--e),border-color 140ms var(--e),transform 120ms var(--e)}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn:active{transform:translateY(1px);background:var(--skeleton)}
.btn svg,.btn img{width:16px;height:16px;object-fit:contain}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{background:color-mix(in oklch,var(--accent),white 8%);border-color:transparent}
.btn-accent:active{background:color-mix(in oklch,var(--accent),black 10%)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn-ink:hover{background:var(--ink);filter:brightness(1.15)}
.btn-sm{height:30px;padding:0 12px;font-size:12px}
:is(button,input,select,textarea):disabled,[aria-disabled="true"]{opacity:.5;filter:saturate(.4);cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);font:600 12px/22px var(--font-body);color:var(--ink-2);white-space:nowrap}
.chip img{width:14px;height:14px;object-fit:contain}
.chip .n{color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--panel);border:1px solid var(--ink);color:var(--ink);font-weight:600}
.seg{display:inline-flex;padding:4px;border-radius:var(--radius-ctl);background:var(--panel-2);border:1px solid var(--line)}
.seg button{border:1px solid transparent;background:none;height:28px;padding:0 12px;border-radius:calc(var(--radius-ctl) - 2px);font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);border:1px solid var(--ink);color:var(--ink);font-weight:600;box-shadow:var(--shadow-seg)}

/* ---------- status ---------- */
.st{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--ink-2)}
.st svg{width:12px;height:12px}
.st.pos{background:var(--pos-soft);color:var(--pos)}.st.neg{background:var(--neg-soft);color:var(--neg)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.acc{background:var(--accent-soft);color:var(--accent-strong)}
.delta{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font:600 12px/16px var(--font-num);font-variant-numeric:tabular-nums;background:var(--pos-soft);color:var(--pos)}
.delta.down{background:var(--neg-soft);color:var(--neg)}
.delta svg{width:12px;height:12px}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(var(--k,4),minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.kpi{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:20px;border-left:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.kpi:first-child{border-left:0}
button.kpi{cursor:pointer}button.kpi:hover{background:var(--row-hover)}
.kpi-l{display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-body);color:var(--ink-2)}
.kpi-v{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font:600 30px/36px var(--font-num)}
.kpi-v b{font:600 30px/36px var(--font-num);font-variant-numeric:tabular-nums;}
.kpi-s{font-size:12px;line-height:16px;color:var(--ink-3);margin-top:8px}
.stack{display:flex;margin-top:12px;align-items:center}
.stack .face{margin-left:-8px;}
.stack .face:first-child{margin-left:0}
.stack .more{margin-left:8px;font-size:12px;color:var(--ink-2)}

/* ---------- panels ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-panel);min-width:0;display:flex;flex-direction:column}
.p-h{display:flex;align-items:center;gap:12px;min-height:52px;padding:16px 20px 12px}
.p-h h2{font:600 16px/24px var(--font-head)}
.p-h .cnt{font:500 13px/20px var(--font-num);color:var(--ink-2);font-variant-numeric:tabular-nums}
.src{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap}
.src img{width:20px;height:20px;object-fit:contain}

.p-sub{padding:0 20px 12px;font-size:13px;line-height:19px;color:var(--ink-2);margin-top:0}
.p-b{padding:0 20px 20px;min-width:0;flex:1}
.p-b.flush{padding:0}
.p-f{border-top:1px solid var(--line);padding:12px 20px;font-size:13px}
.p-f button,.p-f a{border:0;background:none;color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0;text-decoration:none}
.p-f svg{width:14px;height:14px}
.note{padding:16px 20px;border-radius:var(--radius);background:var(--panel-2);border:1px solid var(--line);font-size:14px;line-height:22px}
.note b{font-weight:600}

/* ---------- people ---------- */
.face{flex:none;width:40px;height:40px;border-radius:var(--radius-avatar);background-color:var(--panel-2);background-repeat:no-repeat;background-size:800% 800%;display:inline-grid;place-items:center;font:600 13px/1 var(--font-body);color:var(--ink-2);position:relative}
.face.xs{width:24px;height:24px;font-size:12px}.face.sm{width:32px;height:32px;font-size:12px}.face.lg{width:52px;height:52px;font-size:16px}.face.xl{width:72px;height:72px;font-size:20px}
.face .ch{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:4px;background:var(--panel);display:grid;place-items:center;}
.face .ch img{width:12px;height:12px;object-fit:contain}
.prow{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 20px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;transition:background-color 140ms var(--e)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--row-hover)}
.prow .who{min-width:0;flex:1}
.prow .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prow .l1 b{font-weight:600}
.prow .l1 span{color:var(--ink-2)}
.prow .l2{font-size:13px;line-height:19px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prow .act{flex:none}
.person{display:inline-flex;align-items:center;gap:12px;min-width:0}
.person b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span{display:block;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--logo-bg);display:inline-grid;place-items:center;overflow:hidden}
.logo img,.logo svg{width:70%;height:70%;object-fit:contain}
.logo.txt{font:700 11px/1 var(--font-body);color:var(--logo-ink);background:var(--panel-2)}
.logo.sm{width:20px;height:20px;border-radius:5px}.logo.lg{width:36px;height:36px;border-radius:9px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.t th{position:sticky;top:0;z-index:1;background:none;text-align:left;font-size:12px;line-height:16px;font-weight:600;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.t td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:middle;height:40px}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}.t td.r,.t .numc{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t tbody tr{transition:background-color 140ms var(--e)}
.t tbody tr.click{cursor:pointer}
.t tbody tr:hover td{background:var(--row-hover)}
.t tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
.t th:first-child,.t td:first-child{padding-left:20px}.t th:last-child,.t td:last-child{padding-right:20px}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transform-origin:left}
.grow{}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.growy{transform-origin:bottom}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hatch{background-image:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 7px)}
.flash{}
@keyframes flash{from{background-color:var(--accent-soft)}to{background-color:transparent}}

/* ---------- kanban ---------- */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kb-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kb-h{display:flex;align-items:center;gap:8px;padding:4px 8px 8px;font-weight:600}
.kb-h .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.kb-h .n{margin-left:auto;color:var(--ink-2);font:500 13px var(--font-num);font-variant-numeric:tabular-nums}
.kb-card{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:12px;display:grid;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.kb-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.kb-card .row{display:flex;align-items:center;gap:8px;justify-content:space-between}

/* ---------- drawer ---------- */
